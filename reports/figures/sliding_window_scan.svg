<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="60" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Continuous audio scanning</text>
  <text x="60" y="95" font-family="Arial" font-size="18" fill="#334155">A long recording is scanned with overlapping 3-second windows, not treated as one already-cut clip.</text>
  <line x1="100" y1="180" x2="1100" y2="180" stroke="#0f172a" stroke-width="4"/>
  <text x="95" y="215" font-family="Arial" font-size="15" fill="#475569">0s</text><text x="260" y="215" font-family="Arial" font-size="15" fill="#475569">1s</text><text x="427" y="215" font-family="Arial" font-size="15" fill="#475569">2s</text><text x="594" y="215" font-family="Arial" font-size="15" fill="#475569">3s</text><text x="760" y="215" font-family="Arial" font-size="15" fill="#475569">4s</text><text x="927" y="215" font-family="Arial" font-size="15" fill="#475569">5s</text><text x="1085" y="215" font-family="Arial" font-size="15" fill="#475569">6s</text>
  <rect x="350" y="125" width="280" height="34" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="435" y="148" font-family="Arial" font-size="14">example dog sound</text>
  <rect x="545" y="92" width="330" height="34" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="642" y="115" font-family="Arial" font-size="14">example sheep overlap</text>
  <rect x="100" y="275" width="500" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="120" y="305" font-family="Arial" font-size="18">window 1: 0.0s to 3.0s</text>
  <rect x="183" y="338" width="500" height="46" rx="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><text x="203" y="368" font-family="Arial" font-size="18">window 2: 0.5s to 3.5s</text>
  <rect x="267" y="401" width="500" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="287" y="431" font-family="Arial" font-size="18">window 3: 1.0s to 4.0s</text>
  <rect x="875" y="250" width="250" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="902" y="281" font-family="Arial" font-size="24" font-weight="700">Hop = 0.5s</text><text x="902" y="309" font-family="Arial" font-size="18">matches +/- 500 ms margin</text>
  <text x="92" y="502" font-family="Arial" font-size="18" fill="#334155">Choice: 3-second windows match training clips; 0.5-second hop improves event boundary timing.</text>
</svg>
